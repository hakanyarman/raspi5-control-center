services:
  postgres:
    image: postgres:17
    container_name: raspi5-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: raspi5-control-center-web:local
    container_name: raspi5-web
    restart: unless-stopped
    network_mode: host

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/health"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  camera:
    image: bluenviron/mediamtx:1.20.0-rpi
    container_name: raspi5-camera
    restart: unless-stopped
    network_mode: host
    privileged: true
    tmpfs:
      - /dev/shm:exec
    volumes:
      - /run/udev:/run/udev:ro
      - ./ops/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-O", "/dev/null", "http://127.0.0.1:8889/room/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  postgres_data:
